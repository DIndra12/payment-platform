[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# Input from services via TCP
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

# Parse JSON logs
[FILTER]
    Name              parser
    Match             *
    Key_Name          log
    Parser            docker
    Parser            json
    Reserve_Data      On

# Add service metadata
[FILTER]
    Name              record_modifier
    Match             *
    Record            cluster=payment-platform
    Record            environment=development

# Output to Elasticsearch
[OUTPUT]
    Name              es
    Match             *
    Host              ${ELASTICSEARCH_HOST}
    Port              ${ELASTICSEARCH_PORT}
    HTTP_User
    HTTP_Passwd
    Index             logs-%Y.%m.%d
    Type              _doc
    Retry_Limit       False
    Trace_Error       Off
