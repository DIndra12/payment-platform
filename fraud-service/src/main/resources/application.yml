spring:
  application:
    name: fraud-service

server:
  port: 8082
  error:
    include-message: always
    include-binding-errors: always

# Fraud detection thresholds
fraud:
  detection:
    risk-score-threshold: 75
    high-value-threshold: 10000.00

# Actuator & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.payments.platform: DEBUG
