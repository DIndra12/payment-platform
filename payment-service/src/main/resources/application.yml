spring:
  application:
    name: payment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    # 9094 is the EXTERNAL listener docker-compose publishes to the host; 9092 is
    # the in-network listener and is unreachable when running the service locally.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # StringSerializer, not JsonSerializer: OutboxSenderKafkaAdapter hands over a
      # payload that has ALREADY been serialized to a JSON string. JsonSerializer
      # would encode that string again, putting a quoted/escaped string literal on
      # the topic instead of a JSON object, which every consumer then fails to bind.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

server:
  port: 8083
  error:
    include-message: always

# External service URLs — validated at startup by ExternalServicesProperties
external-services:
  account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  fraud-service-url: ${FRAUD_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.payments.platform: DEBUG
