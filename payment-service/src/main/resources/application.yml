spring:
  application:
    name: payment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    # 9094 is the EXTERNAL listener docker-compose publishes to the host; 9092 is
    # the in-network listener and is unreachable when running the service locally.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # StringSerializer, not JsonSerializer: OutboxSenderKafkaAdapter hands over a
      # payload that has ALREADY been serialized to a JSON string. JsonSerializer
      # would encode that string again, putting a quoted/escaped string literal on
      # the topic instead of a JSON object, which every consumer then fails to bind.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

server:
  port: 8083
  error:
    include-message: always

# External service URLs — validated at startup by ExternalServicesProperties
external-services:
  account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  fraud-service-url: ${FRAUD_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.payments.platform: DEBUG

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      account-service:
        # Circuit opens after 50% failure rate
        failure-threshold: 50
        failure-rate-threshold: 50
        # Move to HALF_OPEN state after 30 seconds
        wait-duration-in-open-state: 30000
        # Try 2 requests in HALF_OPEN state
        permitted-number-of-calls-in-half-open-state: 2
        # Sliding window of 10 requests
        sliding-window-size: 10
        minimum-number-of-calls: 5
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 3000

      fraud-service:
        # Same resilience as account-service
        failure-threshold: 50
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30000
        permitted-number-of-calls-in-half-open-state: 2
        sliding-window-size: 10
        minimum-number-of-calls: 5
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 3000

  retry:
    instances:
      account-service:
        # Retry up to 3 times
        max-attempts: 3
        # Wait 100ms, 200ms, 400ms (exponential backoff)
        wait-duration: 100
        interval-function: exponential
        exponential-backoff-multiplier: 2

      fraud-service:
        # Same retry strategy as account-service
        max-attempts: 3
        wait-duration: 100
        interval-function: exponential
        exponential-backoff-multiplier: 2

  timelimiter:
    instances:
      account-service:
        # Timeout after 2 seconds (only for async/CompletableFuture methods)
        timeout-duration: 2s
        cancel-running-future: true
