spring:
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:test}
    password: ${SPRING_DATASOURCE_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-test-group
      auto-offset-reset: earliest
    producer:
      acks: all

services:
  account-service:
    url: http://localhost:8081
  fraud-service:
    url: http://localhost:8082

external-services:
  account-service:
    url: http://localhost:8081
  fraud-service:
    url: http://localhost:8082

logging:
  level:
    root: WARN
    com.payments.platform: DEBUG

server:
  port: 0
