spring:
  datasource:
    url: jdbc:h2:mem:payment_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-test-group
      auto-offset-reset: earliest
    producer:
      acks: all

services:
  account-service:
    url: http://localhost:8081
  fraud-service:
    url: http://localhost:8082

external-services:
  account-service:
    url: http://localhost:8081
  fraud-service:
    url: http://localhost:8082

logging:
  level:
    root: WARN
    com.payments.platform: DEBUG

server:
  port: 0
