spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-test-group
      auto-offset-reset: earliest
    producer:
      acks: all

external-services:
  account-service-url: http://localhost:8081
  fraud-service-url: http://localhost:8082

logging:
  level:
    root: WARN
    com.payments.platform: DEBUG

server:
  port: 0
