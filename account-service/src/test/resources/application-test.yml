# account-service/src/test/resources/application-test.yml

spring:
  # ✅ DO NOT set datasource.url here — @ServiceConnection handles it automatically
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate          # ✅ keep validate — let Flyway create the schema
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  flyway:
    enabled: true                 # ✅ MUST be true — Flyway creates the tables Hibernate validates

logging:
  level:
    root: WARN
    com.payments.platform: DEBUG
    org.springframework.test: INFO

server:
  port: 0                         # ✅ random port for tests
