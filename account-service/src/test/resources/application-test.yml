spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/accountdb
    username: testuser
    password: testpass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  flyway:
    enabled: false

logging:
  level:
    root: WARN
    com.payments.platform: DEBUG
    org.springframework.test: INFO
    org.springframework.test.context.cache: WARN

server:
  port: 0
