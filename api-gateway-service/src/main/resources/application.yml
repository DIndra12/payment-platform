server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: api-gateway-service
  profiles:
    active: local
  main:
    web-application-type: reactive

  # Disable some autoconfiguration features we don't need
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  # Keycloak OAuth2 Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/payment-platform}"
          jwk-set-uri: "${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/payment-platform/protocol/openid-connect/certs}"

logging:
  level:
    root: INFO
    com.payments.platform: DEBUG
    org.springframework.cloud.gateway: DEBUG
    io.jsonwebtoken: DEBUG

# Backend service URLs. Defaults match start-all (services on the host).
# Set these env vars to Docker hostnames when the gateway runs in a container.
services:
  account:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
  fraud:
    url: ${FRAUD_SERVICE_URL:http://localhost:8082}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
  transaction-history:
    url: ${TRANSACTION_HISTORY_SERVICE_URL:http://localhost:8085}

# JWT Configuration (for token generation in tests)
jwt:
  secret: "your-super-secret-key-that-is-at-least-32-characters-long-for-hs256"
  expiration: 3600000  # 1 hour in milliseconds

# Management endpoints for health checks, metrics, and tracing
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
