server:
  port: 8085
  error:
    include-message: always

spring:
  application:
    name: transaction-history-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transaction_history_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway owns the schema; Hibernate only validates that the entities match it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 50

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    # 9094 is the EXTERNAL listener docker-compose exposes on the host.
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      # Own consumer group: this service consumes payment.completed completely
      # independently of notification-service, and its offsets are its own.
      group-id: ${KAFKA_GROUP_ID:transaction-history-service}
      # earliest so the read model can be rebuilt by resetting offsets and
      # replaying, which is safe because projection is idempotent.
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.payments.platform: DEBUG
    org.springframework.kafka: INFO
